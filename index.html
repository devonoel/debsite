<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deb McIntosh</title>
    <meta name="description" content="Thank you to the residents of Ward 9 in Greater Sudbury.">
    <link href="https://fonts.googleapis.com/css?family=Raleway:400,700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        background-color: #fff;
        color: #3d1961;
        font-family: 'Raleway', Arial, sans-serif;
        border-top: 16px solid #90c84b;
        border-bottom: 16px solid #3d1961;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .message {
        max-width: 640px;
        text-align: center;
      }

      .message p {
        margin: 0 0 1.25em;
        font-size: 1.35rem;
        line-height: 1.6;
      }

      .message .closing {
        color: #90c84b;
        font-size: 1.75rem;
        font-weight: 700;
      }

      .signature {
        margin: 2em 1.5em 0 0;
        text-align: right;
      }

      .signature .name {
        display: block;
        font-size: 1.35rem;
        font-weight: 700;
      }

      .signature .title {
        display: block;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="message">
        <p>Thank you to the residents of Ward 9 in Greater Sudbury. I've very much enjoyed working with you over the last 12 years.</p>
        <p class="closing">See you at the grocery store!</p>
        <div class="signature">
          <span class="name">Deb</span>
          <span class="title">(former City Councillor)</span>
        </div>
      </div>
    </main>
  </body>
</html>
